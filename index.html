<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新品上架大冒险 · 闯关手册</title>
<style>
:root{
  --bg:#f5f6fb; --card:#ffffff; --line:#e7e9f3; --txt:#2b2f3f; --sub:#767d92; --faint:#f4f6fb;
  --p1:#6c63d8; --p1bg:#f0efff; --p2:#3f8fd4; --p2bg:#eaf3fc; --p3:#2f9c78; --p3bg:#e9f7f1;
  --p4:#d9992b; --p4bg:#fdf5e6; --green:#5c9c1e; --greenbg:#eef7e2; --gold:#e2a72c; --danger:#d1592e;
  --shadow:0 1px 10px rgba(70,74,120,.05); --shadow2:0 12px 32px rgba(70,74,120,.13);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);font-size:15.5px;line-height:1.62;-webkit-font-smoothing:antialiased}
.wrap{max-width:1420px;margin:0 auto;padding:0 24px 90px}
h1{font-size:22px;font-weight:800;letter-spacing:-.2px;line-height:1.4}
.muted{color:var(--sub);font-size:13.5px;line-height:1.7}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
.pane{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
.pane-h{font-weight:800;font-size:15.5px;margin-bottom:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button{font-family:inherit;font-size:14.5px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--txt);border-radius:10px;padding:8px 15px;font-weight:600;transition:.14s}
button:hover{background:var(--faint);transform:translateY(-1px)}
button:active{transform:translateY(0)}
button.primary{background:linear-gradient(135deg,#7b72e8,#6259d6);border-color:#6259d6;color:#fff;box-shadow:0 3px 10px rgba(108,99,216,.24)}
button.primary:hover{box-shadow:0 5px 16px rgba(108,99,216,.32);background:linear-gradient(135deg,#847cf0,#6a61dd)}
button.ghost{background:var(--p1bg);border-color:#ddd9fb;color:#4a44a8}
button.gold{background:linear-gradient(135deg,#f0b63f,#dd9a20);border-color:#d99a25;color:#5c4006;box-shadow:0 3px 10px rgba(226,167,44,.28)}
button.small{padding:6px 12px;font-size:13.5px;border-radius:9px}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}
input,select,textarea{font-family:inherit;font-size:14.5px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--txt);width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--p1);box-shadow:0 0 0 3px var(--p1bg)}
label{font-size:13.5px;color:var(--sub);display:block;margin-bottom:5px;font-weight:600}
.bar{height:8px;background:var(--faint);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#9fc95f,#5c9c1e);border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.3,1)}
.pct{font-size:13px;color:var(--sub);font-weight:700}
.tag{display:inline-block;font-size:12.5px;padding:2px 9px;border-radius:99px;margin:0 6px 3px 0;background:var(--faint);color:var(--sub);font-weight:600;vertical-align:middle;line-height:1.55}
.tag.key{background:#fdeee8;color:#c2571f}
.tag.gold{background:var(--p4bg);color:#a87413}
.tag.green{background:var(--greenbg);color:#4a7f15}
.tag.blue{background:var(--p2bg);color:#2f7cb8}
.tag.purple{background:var(--p1bg);color:#4a44a8}
.tag.gray{background:#f0f1f6;color:#8b90a3;text-decoration:line-through}
.tchip{font-size:13.5px;font-weight:700;border-radius:10px;padding:5px 11px;border:1px solid var(--line);background:#fff;display:inline-block;margin:6px 7px 0 0;white-space:nowrap}
.tchip.warn{background:#fdeee8;color:#c2571f;border-color:#f6d3c2}
.tchip.good{background:var(--greenbg);color:#4a7f15;border-color:#d8ebbc}
.chip.coin.pop,.chip.lv.pop{animation:pop .45s}
/* ---------- 顶栏 ---------- */
.top{position:sticky;top:0;z-index:50;background:rgba(245,246,251,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);margin:0 -24px;padding:0 24px}
.top-in{max-width:1420px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-height:58px;padding:8px 0}
.avatar{display:flex;align-items:center;gap:10px;cursor:pointer}
.avatar .ring{position:relative;width:42px;height:42px;flex-shrink:0}
.avatar .ring .lvbadge{position:absolute;right:-4px;bottom:-4px;background:linear-gradient(135deg,#7b72e8,#6259d6);color:#fff;font-size:11.5px;font-weight:800;border-radius:8px;padding:1px 5px;border:2px solid #fff}
.avatar .who .nm{font-weight:800;font-size:15px;line-height:1.3}
.avatar .who .ti{font-size:12.5px;color:var(--sub);margin-top:1px}
.chip{border:1px solid var(--line);border-radius:12px;padding:7px 13px;font-weight:700;font-size:13.5px;background:#fff;white-space:nowrap}
.chip.coin{background:linear-gradient(135deg,#fff9ec,#fdf3dd);border-color:#f0dcae;color:#a87413}
.chip.coin b{font-size:15px}
.chip.lv{background:var(--p1bg);border-color:#dedbfa;color:#4a44a8}
.chip.combo{background:linear-gradient(135deg,#ffefe3,#ffe2cf);border-color:#f6c8a5;color:#c2571f}
.top .sp{flex:1;min-width:10px}
.iconbtn{border:1px solid var(--line);background:#fff;border-radius:10px;width:36px;height:34px;display:flex;align-items:center;justify-content:center;font-size:17px;padding:0}
/* ---------- 两栏工作台 ---------- */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);gap:18px;align-items:start;padding-top:18px}
.main{min-width:0}
.side{position:sticky;top:74px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--shadow);max-height:calc(100vh - 96px);overflow:auto}
.side-sec{font-size:11.5px;font-weight:800;color:#9aa0b4;letter-spacing:.9px;margin:12px 6px 7px}
.side-sec:first-child{margin-top:2px}
.side-empty{font-size:13px;color:var(--sub);padding:8px 8px 4px}
.side-link{display:block;padding:9px 11px;border-radius:11px;cursor:pointer;border:1px solid transparent;transition:.14s;margin-bottom:5px}
.side-link:hover{background:var(--faint)}
.side-link.on{background:var(--p1bg);border-color:#ddd9fb}
.sl-top{display:flex;gap:6px;align-items:center}
.sl-t{flex:1;min-width:0;font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl-bar{height:5px;background:var(--faint);border-radius:99px;margin-top:7px;overflow:hidden}
.sl-bar>i{display:block;height:100%;background:linear-gradient(90deg,#9fc95f,#5c9c1e);border-radius:99px}
.sl-meta{font-size:11.5px;color:var(--sub);margin-top:5px;display:flex;justify-content:space-between;gap:6px}
.mini-del{border:none;background:none;color:#c2571f;font-size:15px;line-height:1;padding:0 2px;cursor:pointer;opacity:.5;box-shadow:none}
.mini-del:hover{opacity:1;background:none;transform:none}
.side-act{display:flex;gap:9px;align-items:center;padding:9px 11px;border-radius:11px;cursor:pointer;font-weight:600;font-size:13.5px;transition:.14s}
.side-act:hover{background:var(--p1bg);color:#4a44a8}
.navlvl{display:flex;gap:8px;align-items:center;padding:7px 8px;margin-top:6px;font-weight:800;font-size:12.5px;color:var(--sub)}
.navlvl .b{width:20px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;flex-shrink:0}
.navlvl .pct{margin-left:auto}
.navst{display:flex;gap:8px;align-items:center;padding:7px 9px 7px 15px;border-radius:9px;cursor:pointer;font-size:12.5px;transition:.13s}
.navst:hover{background:var(--faint)}
.navst .dot{width:6px;height:6px;border-radius:50%;background:#dcdfec;flex-shrink:0}
.navst.done .dot{background:var(--green)}
.navst.active .dot{background:var(--p1)}
.navst .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navst .n{font-size:11.5px;color:var(--sub);font-weight:700}
/* ---------- 首页 ---------- */
.hero{background:linear-gradient(135deg,#ffffff,#f4f2ff 62%,#eef4ff);border:1px solid #e7e5fb;border-radius:18px;padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow)}
.hero-in{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.hero-ava{flex-shrink:0;display:flex}
.hero-txt{flex:1;min-width:220px}
.hero-lv{margin-top:9px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.hero-lv b{color:#4a44a8}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:14px}
.stats .s{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 15px;box-shadow:var(--shadow)}
.stats .s .v{font-size:21px;font-weight:800;color:var(--p1);line-height:1.3;margin:2px 0}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.summary .s{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.summary .s .v{font-size:22px;font-weight:800;color:var(--p1);line-height:1.35;margin:2px 0}
.entry{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:14px}
.entry .btn-card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px;cursor:pointer;transition:.15s;box-shadow:var(--shadow)}
.entry .btn-card:hover{border-color:#c9c4f5;transform:translateY(-2px);box-shadow:var(--shadow2)}
.entry .btn-card .t{font-weight:800;font-size:15.5px;margin-bottom:3px}
.entry .btn-card .ico{font-size:21px;margin-bottom:6px}
.linkcard{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:11px;box-shadow:var(--shadow);cursor:pointer;transition:.15s}
.linkcard:hover{border-color:#c9c4f5;transform:translateY(-2px);box-shadow:var(--shadow2)}
/* ---------- 商品头 ---------- */
.head{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:14px}
.head-top{display:flex;gap:16px;align-items:flex-start}
.head-chips{margin-top:4px}
.head-ring{flex-shrink:0;text-align:center}
.head-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px;padding-top:13px;border-top:1px dashed var(--line)}
/* ---------- 关卡 ---------- */
.lvl{border:1px solid var(--line);border-radius:16px;background:#fff;margin-bottom:14px;overflow:hidden;box-shadow:var(--shadow)}
.lvl-head{padding:13px 17px;display:flex;align-items:center;gap:12px;user-select:none}
.lvl-icon{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.6)}
.lvl-head .nv{font-weight:800;font-size:14px}
.lvl-prog{display:flex;align-items:center;gap:10px;margin-top:7px}
.stage{border-top:1px solid var(--line)}
.stage-head{padding:11px 17px;display:flex;align-items:center;gap:11px;cursor:pointer;user-select:none;font-size:14px;transition:.13s;line-height:1.55}
.stage-head:hover{background:#fafbff}
.st-dot{width:20px;height:20px;border-radius:50%;border:2px solid #dcdfec;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11.5px;color:#fff;font-weight:800;background:#fff}
.stage.done .st-dot{background:var(--green);border-color:var(--green)}
.stage.active .st-dot{background:var(--p1);border-color:var(--p1)}
.stage-body{display:none;padding:11px 17px 15px;background:#fbfcff}
.stage.open .stage-body{display:block;animation:fadein .2s}
@keyframes fadein{from{opacity:0;transform:translateY(-3px)}}
.stage-grp{font-size:12px;font-weight:800;color:var(--sub);letter-spacing:.5px;margin:12px 2px 7px;display:flex;align-items:center;gap:8px}
.stage-grp:before{content:"";width:3px;height:11px;border-radius:2px;background:var(--p2)}
/* ---------- 任务行 ---------- */
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:11px;padding:10px 13px;background:#fff;border:1px solid var(--line);border-radius:12px;transition:.13s;position:relative}
.row:hover{border-color:#cbc7f3;box-shadow:0 1px 8px rgba(70,74,120,.06)}
.row.done{background:#f9fdf3;border-color:#dcecc4}
.row.open{border-color:#c9c4f5;background:#fcfcff;box-shadow:0 2px 10px rgba(108,99,216,.08)}
.row.pop{animation:pop .42s}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.012)}100%{transform:scale(1)}}
.chk{width:21px;height:21px;border-radius:7px;border:2px solid #d6d9e7;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;background:#fff;transition:.15s}
.chk:hover{border-color:var(--p1);background:var(--p1bg)}
.row.done .chk{background:linear-gradient(135deg,#83c23c,#5c9c1e);border-color:#5c9c1e;animation:chkin .35s}
@keyframes chkin{0%{transform:scale(.6)}60%{transform:scale(1.16)}100%{transform:scale(1)}}
.chk svg{display:none}
.row.done .chk svg{display:block}
.row-main{flex:1;min-width:0;cursor:pointer}
.row-name{font-weight:700;font-size:14.5px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.done .row-name{color:var(--sub);text-decoration:line-through}
.row.nopick{background:#fbfbfd;border-style:dashed;opacity:.78}
.row.nopick .chk{opacity:.4;cursor:not-allowed}
.row.nopick .row-name{color:#9a9db1}
.row-sub{font-size:12.5px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-right{display:flex;gap:6px;align-items:center;flex-shrink:0}
.row-right .tag{margin:0}
.row-right .hot{color:#c2571f;font-weight:800;font-size:13px}
.car{color:#b6bad0;font-size:10px;width:12px;text-align:center}
.row-detail{padding:14px 16px 15px;border:1px solid #ddd9fb;border-radius:12px;background:#fcfcff;margin-top:-2px}
.d-tags{margin-bottom:2px}
.task-acts{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:12px}
.t-meta{font-size:13.5px;color:var(--p2);margin-top:6px;line-height:1.75}
.t-req{font-size:13.5px;color:var(--sub);margin-top:6px;line-height:1.75}
.t-help{margin-top:12px;padding:12px 14px;background:linear-gradient(135deg,#f4f3ff,#eef4ff);border-radius:12px;font-size:13.5px;color:#4a44a8;line-height:1.85;border:1px solid #e8e7fc}
input.note{margin-top:12px;background:#fffdf7;border-color:#f0e2c4;font-size:14px}
input.note:disabled{background:#f8faf5;color:var(--sub)}
.lnk-row{display:flex;gap:9px;align-items:center;margin-top:12px;flex-wrap:wrap}
.lnk-row input{flex:1;min-width:150px;font-size:13.5px;padding:7px 10px;background:#fcfdff}
a.lnk-go{display:inline-flex;align-items:center;gap:5px;font-size:13.5px;font-weight:700;color:#1f7a4d;background:#e9f7f1;border:1px solid #c5e7d8;border-radius:10px;padding:7px 13px;text-decoration:none;transition:.14s}
a.lnk-go:hover{background:#dcf1e8;transform:translateY(-1px)}
/* ---------- 最终章 ---------- */
.finbar{padding:15px 17px;background:linear-gradient(135deg,#fffaf0,#fdf3e0);border-bottom:1px solid #f2e3c4;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.finbar .fin-txt{font-size:13.5px;font-weight:700;flex:1;min-width:220px;line-height:1.85}
.newbtn{border:1px dashed #cfd3e6;background:#fcfdff;color:var(--sub);border-radius:11px;padding:10px;font-size:13.5px;font-weight:700;width:100%;text-align:center}
.newbtn:hover{border-color:var(--p1);color:var(--p1);background:var(--p1bg)}
.addform{background:#f8f9ff;border:1px solid #e2e4f4;border-radius:14px;padding:16px;margin-bottom:12px}
.gstage{padding:16px 20px 8px}
/* ---------- 徽章 / 图鉴 ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:14px}
.char{background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px 13px;text-align:center;transition:.15s;box-shadow:var(--shadow)}
.char.owned{border-color:#cfe6ae;background:linear-gradient(180deg,#fbfef6,#f5fbea)}
.char:hover{transform:translateY(-3px);box-shadow:var(--shadow2)}
.char .art{display:flex;justify-content:center;margin-bottom:8px}
.char .nm{font-weight:800;font-size:15px}
.char .ds{font-size:13px;color:var(--sub);min-height:38px;line-height:1.6;margin:4px 0 10px}
.crumb{font-size:13.5px;color:var(--sub);cursor:pointer;margin-bottom:12px;font-weight:700;display:inline-block}
.crumb:hover{color:var(--p1)}
.searchrow{display:flex;gap:11px;align-items:center;flex-wrap:wrap;margin-bottom:15px}
.guide-item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
/* ---------- 豆腐块（秘籍页） ---------- */
.tofu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:10px}
.tofu{font-family:inherit;font-size:14px;font-weight:600;height:46px;padding:0 13px;border-radius:11px;border:1px solid var(--line);background:#fff;color:var(--sub);cursor:pointer;transition:.13s;max-width:100%;display:flex;align-items:center;white-space:nowrap;overflow:hidden;text-align:left}
.tofu:hover{border-color:#c9c4f5;background:var(--p1bg);color:var(--txt);transform:translateY(-1px)}
.tofu.zone{background:#f2fbec;border-color:#d8ebbc;color:#3f6d12}
.tofu.zone:hover{background:#e6f6db}
.tofu.done{background:linear-gradient(135deg,#7cba3d,#5c9c1e);border-color:#5c9c1e;color:#fff}
.tofu.done:hover{background:linear-gradient(135deg,#7cba3d,#5c9c1e);color:#fff}
.tofu .tx{overflow:hidden;text-overflow:ellipsis;min-width:0}
.tofu .marks{margin-left:auto;display:inline-flex;gap:6px;align-items:center;flex-shrink:0;padding-left:8px}
.tofu .kdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#c2571f}
.tofu .cdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#7f77dd}
.tofu.done .kdot,.tofu.done .cdot{background:rgba(255,255,255,.9)}
.tofu .hot{color:#c2571f;font-weight:800}
.tofu.done .hot{color:#fff}
.tofu.off{opacity:.55;background:#f8f9fd;border-style:dashed}
.tofu.off:hover{opacity:.85}
.cqa{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:12px;background:#fcfcff}
.cqa-h{display:flex;gap:9px;align-items:center;flex-wrap:wrap;font-size:13.5px;line-height:1.7}
.cqa-h .sp{flex:1;min-width:10px}
.cqa textarea{margin-top:9px;font-size:13.5px;line-height:1.85}
.fitline{margin-top:10px;padding:11px 14px;border-radius:11px;background:#fffaf0;border:1px solid #f2e3c4;color:#a87413;font-size:13.5px;line-height:1.85}
.gt{font-weight:700;font-size:16px}
.empty{padding:36px 18px;text-align:center;color:var(--sub);line-height:1.85}
.big{font-size:23px;font-weight:800}
/* ---------- 动效 ---------- */
.confetti{position:fixed;top:-14px;width:9px;height:14px;z-index:99;pointer-events:none;animation:fall linear forwards;border-radius:2px}
@keyframes fall{to{transform:translateY(106vh) rotate(720deg);opacity:.85}}
.fly{position:fixed;transform:translate(-50%,-50%);transition:all .9s cubic-bezier(.35,.05,.6,1);font-weight:900;color:#dd9a20;pointer-events:none;z-index:200;font-size:17px;text-shadow:0 2px 8px rgba(255,255,255,.9)}
#toasts{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:9px;align-items:center;pointer-events:none}
.toast{background:#3b3f4d;color:#fff;border-radius:12px;padding:10px 19px;font-weight:700;font-size:14.5px;box-shadow:0 9px 24px rgba(47,51,64,.2);animation:tin .25s,tout .4s 2.4s forwards;max-width:88vw}
.toast.gold{background:linear-gradient(135deg,#efb43e,#dc9a1d);color:#573c04}
@keyframes tin{from{opacity:0;transform:translateY(-14px) scale(.95)}}
@keyframes tout{to{opacity:0;transform:translateY(-10px)}}
.dialog{position:fixed;inset:0;background:rgba(44,48,64,.42);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:110;padding:24px}
.dialog.show{display:flex;animation:fadein .2s}
.dialog .card{width:min(660px,94vw);margin:0;text-align:center;box-shadow:var(--shadow2);animation:popin .3s cubic-bezier(.2,1.1,.4,1);max-height:88vh;overflow-y:auto;overscroll-behavior:contain;border-radius:20px;padding:22px 24px}
.dlg-foot{position:sticky;bottom:0;background:#fff;padding:13px 0 3px;margin-top:15px;border-top:1px solid var(--line)}
.dlg-head{position:sticky;top:0;z-index:3;background:#fff;padding:3px 0 12px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.pf-cols{display:grid;grid-template-columns:1fr 1fr;gap:0 26px;align-items:start}
@media (max-width:780px){.pf-cols{grid-template-columns:1fr}}
@media (max-width:640px){.dialog{padding:10px}.dialog .card{max-height:92vh;padding:18px 15px}}
@keyframes popin{from{transform:scale(.92);opacity:0}}
.stamp{display:inline-block;font-size:12.5px;font-weight:800;padding:2px 9px;border-radius:99px;background:linear-gradient(135deg,#83c23c,#5c9c1e);color:#fff}
.clear-banner{margin:7px 0 13px;padding:11px 16px;background:linear-gradient(135deg,#f0f9e4,#e4f4d2);border:1px solid #d4e9b5;color:#43730f;border-radius:12px;font-weight:800;font-size:14px;text-align:center}
/* ---------- 时间醒目 ---------- */
.tag.time{background:#fdf5e6;color:#a87413;font-weight:800;border:1px solid #f0dcae}
.tag.time-hot{background:#fdeee8;color:#c2571f;font-weight:800;border:1px solid #f6c8a5;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.5}}
.tchip.time-hot{background:#fdeee8;color:#c2571f;border-color:#f09595;font-weight:800}
/* ---------- 情报站 / 今日三件事 ---------- */
.intel{display:flex;gap:14px;align-items:flex-start;background:linear-gradient(135deg,#f0efff,#eaf3fc);border:1px solid #ddd9fb;border-radius:16px;padding:14px 16px;margin-bottom:14px}
.intel .say{font-size:14.5px;line-height:1.85;flex:1}
.intel .say b{color:#5b53c4}
.push{background:#fff;border:1px solid #f6c8a5;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.push .p-item{display:flex;gap:13px;align-items:center;background:#fffdf7;border:1px solid #f0e2c4;border-radius:12px;padding:11px 14px;margin-top:10px;cursor:pointer;transition:.14s}
.push .p-item:hover{border-color:#e2a72c;transform:translateY(-1px)}
.p-item{display:flex;gap:13px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-top:10px;cursor:pointer;transition:.14s}
.p-item:hover{border-color:#c9cdf0}
.p-item .pn{font-weight:800;font-size:14.5px;flex:1;min-width:0;line-height:1.55}
.push .p-item .pn{font-weight:800;font-size:14.5px;flex:1;min-width:0;line-height:1.55}
.urgent-strip{margin-bottom:14px;padding:13px 16px;background:linear-gradient(135deg,#fdeee8,#fde3e3);border:1px solid #f6c8a5;border-radius:14px;color:#c2571f;font-weight:700;font-size:14.5px;line-height:1.85;cursor:pointer}
.urgent-strip b{font-size:15px}
.next-strip{margin-bottom:14px;padding:12px 16px;background:linear-gradient(135deg,#f0efff,#e8f0fe);border:1px solid #ddd9fb;border-radius:14px;color:#4a44a8;font-weight:700;font-size:14.5px;cursor:pointer;line-height:1.8}
.tplrow{display:flex;gap:11px;align-items:center;margin-top:12px;flex-wrap:wrap}
.imgbox{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:11px;max-height:330px;overflow:auto;padding:3px;border-radius:13px}
.imgbox:empty{display:none}
.imgcell{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#f7f8fc}
.imgcell img{width:100%;height:92px;object-fit:cover;display:block;background:#eef0f7}
.imgcell .fn{font-size:12px;color:var(--sub);padding:4px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.imgcell .del{position:absolute;top:5px;right:5px;padding:0 8px;border-radius:99px;font-size:12px;line-height:21px;background:rgba(255,255,255,.94);border:1px solid var(--line);cursor:pointer;font-family:inherit}
.drop{border:1.5px dashed #c9c4f5;border-radius:13px;padding:16px;text-align:center;color:var(--sub);background:#fafaff;cursor:pointer;line-height:1.8;font-size:13.5px;transition:.13s}
.drop:hover,.drop.on{background:var(--p1bg);border-color:#a9a1f0;color:#4f47bd}
.sug{margin-top:16px;border-top:1px dashed var(--line);padding-top:13px}
.sug-h{font-weight:800;font-size:13.5px;color:#5b53c4;margin-bottom:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;line-height:1.65}
.sugchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.sugchip{font-family:inherit;font-size:13.5px;line-height:1.65;background:#f6f5ff;border:1px solid #ddd9fb;color:#4f47bd;border-radius:10px;padding:8px 12px;cursor:pointer;max-width:100%;text-align:left;transition:.13s}
.sugchip:hover{background:#eceaff;border-color:#bcb5f7;transform:translateY(-1px)}
.sugchip .k{font-weight:800;color:#8a82e6;margin-right:6px}
.rbox{margin-top:12px;background:#f8f9fd;border:1px solid var(--line);border-radius:13px;padding:14px}
.rbox .r-h{font-weight:800;font-size:13.5px;margin-bottom:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;line-height:1.65}
.recchip{font-family:inherit;font-size:13.5px;background:#fff;border:1px solid #ddd9fb;color:#4f47bd;border-radius:10px;padding:8px 12px;cursor:pointer;text-align:left;transition:.13s}
.recchip:hover{background:#f6f5ff;border-color:#bcb5f7}
.recchip.done{background:#f0f9e4;border-color:#d4e9b5;color:#43730f;text-decoration:line-through}
.spin{display:inline-block;width:12px;height:12px;border:2px solid #ddd9fb;border-top-color:#6c63d8;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
/* ---------- 窄屏 ---------- */
@media (max-width:1060px){
  .shell{grid-template-columns:1fr;gap:14px;padding-top:14px}
  .side{position:static;max-height:none}
  .stats{grid-template-columns:repeat(2,1fr)}
  .tofu-grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
}
@media (max-width:640px){
  .wrap{padding:0 14px 70px}
  .top{margin:0 -14px;padding:0 14px}
  .row{padding:9px 11px}
  .row-right .tag{font-size:11.5px;padding:1px 7px}
  .btn-card,.char{padding:13px}
}

.map-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px;margin-top:12px}
.knowledge-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:12px}
@media(max-width:760px){.knowledge-grid{grid-template-columns:1fr}}
.map-card{border:1px solid var(--line);border-radius:14px;padding:14px 15px;cursor:pointer;transition:.15s;background:var(--card)}
.map-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(60,70,120,.10)}
.mc-ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;margin-bottom:8px}
.mc-t{font-weight:800;font-size:15px;margin-bottom:2px}
.aihub-tabs{display:flex;gap:9px;margin:14px 0 16px;flex-wrap:wrap}
.aitab{padding:9px 22px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:700;cursor:pointer;font-size:14.5px;color:var(--txt)}
.aitab.on{background:var(--p1);border-color:var(--p1);color:#fff}
/* ---------- V2 AI 执行链路 ---------- */
.agent-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:12px 0 15px}
.agent-stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px 14px}
.agent-stat .num{font-size:22px;font-weight:800;color:var(--p1);line-height:1.25}
.agent-stat.warn .num{color:#c2571f}.agent-stat.good .num{color:var(--green)}
.agent-plan{border:1px solid #ddd9fb;background:linear-gradient(135deg,#f8f7ff,#f2f6ff);border-radius:15px;padding:15px 16px;margin-bottom:14px}
.agent-plan h3{font-size:15px;margin-bottom:6px}.agent-plan p{font-size:13.5px;color:var(--sub);line-height:1.8}
.task-ai-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:7px}
.skill-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:99px;background:#f6f5ff;color:#4f47bd;border:1px solid #ddd9fb;font-size:12px;font-weight:700}
.skill-chip.local{background:#f8f9fd;color:var(--sub);border-color:var(--line)}
.qa-box{margin-top:12px;border:1px solid #d8ebbc;background:#f7fbea;border-radius:12px;padding:11px 13px}
.qa-box.warn{border-color:#f2e3c4;background:#fffaf0}.qa-box.fail{border-color:#f6c8a5;background:#fff5f1}
.qa-title{font-weight:800;font-size:13.5px}.qa-issue{font-size:13px;color:var(--sub);margin-top:4px;line-height:1.7}
.artifact-ver{margin-top:9px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.artifact-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
@media (max-width:640px){.agent-summary{grid-template-columns:repeat(2,1fr)}.artifact-actions{gap:6px}}
</style>

/* ================= 时间引擎（推动用） ================= */
function daysToLaunch(t){
  if(!t||!t.launchDate)return null;
  return Math.ceil((new Date(t.launchDate+"T00:00:00").getTime()-new Date(new Date().setHours(0,0,0,0)).getTime())/864e5);
}
function deadlineOffset(timeStr){
  var s=timeStr||"";
  if(s.indexOf("上架当天")>=0)return 0;
  if(s.indexOf("上架前3天")>=0||s.indexOf("上架前 3 天")>=0)return -3;
  if(s.indexOf("上架1-2天")>=0)return 2;
  if(s.indexOf("货到3-7天")>=0)return 7;
  if(s.indexOf("3-10天")>=0)return 10;
  if(s.indexOf("7天")>=0)return 7;
  return null;
}
function isTimeHot(t,timeStr){
  var d=daysToLaunch(t);if(d===null||!timeStr)return false;
  var off=deadlineOffset(timeStr);if(off===null)return false;
  return (d-off)<=2;
}
function timeTag(t,timeStr){
  if(!timeStr)return "";
  return '<span class="tag '+(isTimeHot(t,timeStr)?"time-hot":"time")+'">⏰ '+esc(timeStr)+'</span>';
}
/* 收集已进入/临近执行窗口的未完成项目（强推动数据源） */
function urgentTasks(t){
  var d=daysToLaunch(t);if(d===null)return [];
  var out=[];
  LEVELS.forEach(function(l,li){l.stages.forEach(function(s,si){
    tasksOf(t,li,si).forEach(function(it){
      if(!inScope(t,l,it)||isDoneById(t,it.id))return;
      var off=deadlineOffset(it.task.t);if(off===null)return;
      var dl=d+off;
      if(dl<=2)out.push({t:t,it:it,li:li,si:si,dl:dl});
    });
  })});
  out.sort(function(a,b){return a.dl-b.dl});
  return out;
}
/* 单条任务的今日推荐：紧急（时间窗口）优先，其余按线路顺序补齐 */
function recommendForTask(t,n){
  var out=urgentTasks(t);
  if(out.length<n){
    var seen={};
    out.forEach(function(u){seen[u.it.id]=1});
    LEVELS.forEach(function(l,li){l.stages.forEach(function(s,si){
      tasksOf(t,li,si).forEach(function(it){
        if(out.length>=n+4)return;
        if(!inScope(t,l,it)||isDoneById(t,it.id)||seen[it.id])return;
        out.push({t:t,it:it,li:li,si:si,dl:daysToLaunch(t)});
      });
    })});
  }
  return out.slice(0,n);
}

  var seen={},out=[];

function suggestFor(t,task){

function taskMode(task,li,si){

var IMGDB={db:null,tried:false};

  return new Promise(function(res){
    if(IMGDB.db){res(IMGDB.db);return}
    if(IMGDB.tried){res(null);return}
    IMGDB.tried=true;
    try{
      if(!window.indexedDB){res(null);return}
      var rq=indexedDB.open("sop-img-store",1);
      rq.onupgradeneeded=function(){var d=rq.result;if(!d.objectStoreNames.contains("imgs"))d.createObjectStore("imgs")};
      rq.onsuccess=function(){IMGDB.db=rq.result;res(IMGDB.db)};

    }catch(e){res(null)}
  });

        var tx=d.transaction("imgs","readwrite");

  });

function recognizeProfile(t,status){
  var refs=((t.profile&&t.profile.imgs)||[]);
  if(!refs.length)return Promise.reject(new Error("先上传详情页图片"));
  if(status)status("读取 "+refs.length+" 张图片…",true);
  return Promise.all(refs.map(function(r){return imgRefData(r)})).then(function(all){
    all=all.filter(Boolean);
    if(!all.length)throw new Error("图片读取失败，请重新上传");
    var cfg=aiCfg();
    if(cfg.ocr===false&&!cfg.key)throw new Error("已关闭本地 OCR，且未配置 AI 接口");
    var tiles=[],tileChain=Promise.resolve();
    all.forEach(function(u){tileChain=tileChain.then(function(){return prepOcrTiles(u,1600,1800).then(function(xs){tiles=tiles.concat(xs)})})});
    return tileChain.then(function(){return ocrImages(tiles,status)}).then(function(raw){
      raw=String(raw||"").trim();
      if(!raw)throw new Error("OCR 未提取到原始文字，请上传更清晰的详情页图片");
      var base={pts:[],params:[],audience:"",scene:"",service:"",keywords:"",rawOcr:raw,engine:"ocr"};
      if(cfg.url&&cfg.key){
        if(status)status("AI 正在清洗 OCR 原文并整理商品档案…",true);
        return aiCleanText(raw).then(function(r){
          r.rawOcr=raw;r.engine="ai-clean";return r;
        }).catch(function(){
          base.aiError="AI 清洗失败，已保留原始 OCR 文本";return base;
        });
      }
      base.aiError="未配置 AI 接口，暂不把 OCR 碎片填入档案";
      return base;
    });
  });
}

function profLines(s){return (s||"").split(/\n+/).map(function(x){return x.trim()}).filter(Boolean)}
function cqaFill(s,t){
  var p=(t&&t.profile)||{},pts=profLines(p.pts),par=profLines(p.params);
  var d={
    name:(t&&t.name)||"本品",
    aud:String(p.note||"").trim()||"详情页标注的目标人群",
    pts1:pts[0]||"核心卖点（详见详情页）",

    par3:par[2]||par[0]||"补充参数（详见详情页）"
  };
  return String(s).replace(/\{(name|aud|pts1|pts2|pts3|par1|par2|par3)\}/g,function(m,k){return d[k]||""});
}
function categoryOf(t){

/* —— ① 20 条买家秀·问大家问答 —— */
function qa20For(t){
  var cat=categoryOf(t),bank=QA20_BANK[cat]||QA20_BANK.generic,out=[];
  out.push("【买家秀 · 问大家问答 20 条】");
  out.push("商品："+((t&&t.name)||"未命名")+"　品类线："+CAT_NAME[cat]);
  out.push("说明：问题按消费者真实决策顺序排列，回复话术已结合商品档案，可直接用于问大家铺设与客服话术库。");
  out.push("");
  bank.slice(0,20).forEach(function(x,i){
    out.push("Q"+(i+1)+"："+cqaFill(x[0],t));
    out.push("A"+(i+1)+"："+cqaFill(x[1],t));
    out.push("");
  });
  if(!profileFilled(t))out.push("⚠️ 当前尚未建档：回复中的卖点与参数为占位文案，建议先上传详情页并填写档案后重新生成。");
  out.push("【合规提醒】避免「最好、第一、绝对」等极限词，不得出现医疗功效与承诺性描述，回复须与详情页一致。");
  return out.join("\n");
}
function qa20Prompt(t,task){
  var lines=["你是一名资深天猫运营专家 + 消费者行为分析师。请先完整阅读商品「"+((t&&t.name)||"商品名")+"」的详情页图片与已归档档案，然后输出 20 条买家秀·问大家问答：",""];
  lines.push(profBlock(t));
  lines.push("【输出要求】");
  lines.push("1. 模拟真实消费者口吻提问，覆盖价格、功能、噪音或性能、清洗或保养、材质安全、容量或尺寸、售后、物流、对比、顾虑等维度，共 20 条；");
  lines.push("2. 每条配一条口语化、自然、可直接使用的标准回复，回复中自然带入本品的核心卖点与参数，避免广告法违规用词；");
  lines.push("3. 按 Q1/A1 … Q20/A20 的格式输出，不要额外解释。");
  if(task&&task.h)lines.push("","项目要求参考："+task.h);
  return lines.filter(function(x){return x!==null&&x!==undefined}).join("\n");
}

function aiAsk(t,prompt,useImgs,maxImgs){
  var cfg=aiCfg(),ep=aiEndpoint(cfg.url);
  if(!ep||!cfg.key)return Promise.reject(new Error("未配置 AI 接口"));
  var refs=useImgs?(((t&&t.profile&&t.profile.imgs)||[]).slice(0,maxImgs||6)):[];
  return Promise.all(refs.map(function(r){return imgRefData(r)})).then(function(all){
    all=all.filter(Boolean);
    var small=[],chain=Promise.resolve();
    all.forEach(function(u){chain=chain.then(function(){return shrinkDataUrl(u,1280,.82).then(function(x){small.push(x||u)})})});
    return chain.then(function(){
      var content=[{type:"text",text:prompt}];
      small.forEach(function(u){content.push({type:"image_url",image_url:{url:u}})});
      var body={model:cfg.model||"qwen-vl-plus",messages:[{role:"user",content:content}],temperature:0.5};
      return fetch(ep,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+cfg.key},body:JSON.stringify(body)})
        .then(function(r){return r.json().catch(function(){throw new Error("接口返回异常（HTTP "+r.status+"）")})})
        .then(function(j){
          var txt="";
          try{txt=j.choices[0].message.content}catch(e){}
          if(Array.isArray(txt))txt=txt.map(function(x){return x.text||""}).join("");
          if(!txt)throw new Error((j.error&&(j.error.message||j.error.code))||"接口未返回内容");
          return txt;
        });
    });
  });
}

function countTotal(t){var n=0;LEVELS.forEach(function(l,li){l.stages.forEach(function(s,si){tasksOf(t,li,si).forEach(function(it){if(inScope(t,l,it))n++})})});return n}
function countDone(t,li){var c=0;LEVELS.forEach(function(l,i){if(li!==undefined&&i!==li)return;
  l.stages.forEach(function(s,si){tasksOf(t,i,si).forEach(function(it){if(inScope(t,l,it)&&isDoneById(t,it.id))c++})})});return c}
function stageTotal(t,li,si){return tasksOf(t,li,si).filter(function(it){return inScope(t,LEVELS[li],it)}).length}
function stageDone(t,li,si){return tasksOf(t,li,si).filter(function(it){return inScope(t,LEVELS[li],it)&&isDoneById(t,it.id)}).length}
function levelTotal(t,li){return LEVELS[li].stages.reduce(function(a,s,si){return a+stageTotal(t,li,si)},0)}
function allDone(t){var tt=countTotal(t);return tt>0&&countDone(t)===tt}

  customArr(t,3,0).forEach(function(item){if(isDoneById(t,"3-0-c"+item.cid))c++});return c}

function prepOcrTiles(url,maxW,maxH){
  maxW=maxW||1600;maxH=maxH||1800;
  return new Promise(function(res){
    try{
      var img=new Image();
      img.onload=function(){
        try{
          var sc=Math.min(1,maxW/img.width),outW=Math.max(1,Math.round(img.width*sc));
          var srcTileH=Math.max(1,Math.floor(maxH/sc)),tiles=[];
          for(var sy=0;sy<img.height;sy+=srcTileH){
            var sh=Math.min(srcTileH,img.height-sy),outH=Math.max(1,Math.round(sh*sc));
            var cv=document.createElement("canvas");cv.width=outW;cv.height=outH;
            var cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,outW,outH);cx.drawImage(img,0,sy,img.width,sh,0,0,outW,outH);
            try{
              var im=cx.getImageData(0,0,outW,outH),d=im.data;
              for(var i=0;i<d.length;i+=4){var g=.299*d[i]+.587*d[i+1]+.114*d[i+2];g=Math.max(0,Math.min(255,(g-128)*1.22+132));d[i]=d[i+1]=d[i+2]=g}
              cx.putImageData(im,0,0);
            }catch(e){}
            tiles.push(cv.toDataURL("image/jpeg",.9));
          }
          res(tiles);
        }catch(e){res([url])}
      };
      img.onerror=function(){res([url])};img.src=url;
    }catch(e){res([url])}
  });
}

  var prompt="为电商商品「"+name+"」制作"+task.n+"，严格保持真实产品外观、颜色、比例和文字参数，不新增不存在的功能。商品卖点："+(p.pts||"待补充")+"；规格："+(task.s||"按任务规格")+"；品牌规范："+(p.certs||"遵守平台合规要求")+"。"+(extraPrompt?"补充要求："+extraPrompt:"请根据参考图完成图生图")+" 输出干净、可用于电商页面的视觉成品。";

function animateCoins(){
  var el=document.getElementById("coinNum");if(!el)return;
  var target=wallet().coins;
  if(lastCoins===null||lastCoins===target){el.textContent=target;lastCoins=target;return}
  var from=lastCoins,steps=14,i=0;
  el.textContent=from;lastCoins=target;
  var iv=setInterval(function(){
    i++;var v=Math.round(from+(target-from)*(i/steps));
    if(el)el.textContent=v;
    if(i>=steps){clearInterval(iv);if(el)el.textContent=target}
  },28);
}

  document.querySelectorAll("[data-gitem]").forEach(function(el){
    el.onclick=function(){
      var tt=t||stubTask();
      var p=el.dataset.gitem.split("|");
      var it=findItem(tt,+p[0],+p[1],p[2]);
      if(it)showGuideItem(tt,+p[0],+p[1],it);
      else toast("该项目不存在或已被移除");
    };
  });
  document.getElementById("gBack").onclick=function(){
    if(view.taskId&&db.tasks.some(function(x){return x.id===view.taskId})){view={page:"game",taskId:view.taskId,open:{},addAt:null,editAt:null,onlyTodo:false,prevPage:"guide",prevTaskId:view.taskId};render()}
    else{view={page:"home",taskId:null,open:{}};render()}
  };
  document.querySelectorAll("[data-glvl]").forEach(function(el){
    el.onclick=function(){var li=+el.dataset.glvl;view.guideLvl=(view.guideLvl===li?null:li);sfx.pick();render()};
  });
  var gq=document.getElementById("gq");
  gq.oninput=function(){view.q=gq.value};
  gq.onchange=function(){render()};
  document.getElementById("gOnly").onchange=function(e){view.onlyTodo=e.target.checked;render()};
  document.getElementById("gClear").onclick=function(){view.q="";view.onlyTodo=false;render()};
}
/* ================= 徽章图鉴 ================= */
function renderShop(){
  var w=wallet(),lv=levelOf();
  var html=hud(true)+
    '<div class="crumb" id="sBack">&larr; 返回'+(view.taskId&&db.tasks.some(function(x){return x.id===view.taskId})?"「"+esc((db.tasks.find(function(x){return x.id===view.taskId})||{}).name)+"」":"基地")+'</div>'+
    '<h1 style="margin-bottom:10px">徽章图鉴 · 金币兑换</h1>'+
    '<div class="muted" style="margin-bottom:20px;line-height:1.9">完成任务赚金币，在这里兑换卡通角色徽章；越稀有可爱的角色需要金币越多。已拥有 <b>'+db.chars.length+'/'+CHARS.length+'</b>。已拥有的角色可以点「设为形象」，会显示在左上角。</div>'+
    '<div class="summary"><div class="s"><div class="muted">可用金币</div><div class="v">'+w.coins+'</div></div>'+
    '<div class="s"><div class="muted">已花费</div><div class="v">'+(w.spent||0)+'</div></div>'+
    '<div class="s"><div class="muted">等级</div><div class="v">Lv.'+lv+'</div><div class="muted">'+esc(titleOf(lv))+'</div></div></div>'+
    '<div class="grid">';
  CHARS.forEach(function(c){
    var owned=hasChar(c.id);
    html+='<div class="char'+(owned?" owned":"")+'">'+
      '<div class="art">'+charSvg(c,64)+'</div>'+
      '<div class="nm">'+esc(c.name)+'</div>'+
      '<div class="ds">'+esc(c.desc)+'</div>'+
      (owned?('<span class="tag green">已拥有</span>'+(db.avatar===c.id?'<span class="tag gold">当前形象</span>':'<div style="margin-top:5px"><button class="small" data-wear="'+c.id+'">设为形象</button></div>')):
        (c.earn?'<span class="tag">进度解锁</span>':
          (w.coins>=c.price?'<button class="primary small" data-buy="'+c.id+'">'+c.price+' 金币兑换</button>'
                           :'<button class="small" disabled>'+c.price+' 金币</button>')))+
      '</div>';
  });
  html+='</div>';
  app.innerHTML=html;
  bindHud();
  document.getElementById("sBack").onclick=function(){
    if(view.taskId&&db.tasks.some(function(x){return x.id===view.taskId})){view={page:"game",taskId:view.taskId,open:{},addAt:null,editAt:null,onlyTodo:false,prevPage:"shop",prevTaskId:view.taskId};render()}
    else{view={page:"home",taskId:null,open:{}};render()}
  };
  document.querySelectorAll("[data-buy]").forEach(function(el){
    el.onclick=function(){
      var c=CHARS.filter(function(x){return x.id===el.dataset.buy})[0];
      if(!c||hasChar(c.id))return;
      if(wallet().coins<c.price){sfx.err();toast("金币不够，再完成几个项目吧");return}
      wallet().coins-=c.price;wallet().spent=(wallet().spent||0)+c.price;
      db.chars.push(c.id);if(!db.avatar)db.avatar=c.id;save();
      sfx.buy();confetti(40);toast("兑换成功！获得【"+c.name+"】",true);
      render();
    };
  });
  document.querySelectorAll("[data-wear]").forEach(function(el){
    el.onclick=function(){db.avatar=el.dataset.wear;save();sfx.pick();toast("已更换形象");render()};
  });
}
render();
</script>
</body>
</html>
